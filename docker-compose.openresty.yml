name: k6-playground-openresty

services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: k6-playground-workspace
    working_dir: /workspaces/K6_Playground
    command: bash -lc "bash .devcontainer/bootstrap-workspace.sh"
    environment:
      BASE_URL: http://edge
      JUPYTER_PORT: 8888
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - .:/workspaces/K6_Playground
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      edge:
        condition: service_healthy
      origin:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - playground
    ports:
      - "8888:8888"

  origin:
    build:
      context: ./origin
    container_name: k6-playground-origin
    environment:
      PORT: 8000
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - playground

  edge:
    build:
      context: ./edge
    container_name: k6-playground-edge
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT_MS: 150
      REDIS_SEND_TIMEOUT_MS: 150
      REDIS_READ_TIMEOUT_MS: 250
      REDIS_KEEPALIVE_TIMEOUT_MS: 60000
      REDIS_KEEPALIVE_POOL: 100
      METADATA_BASE_URL: http://metadata:9100
      METADATA_TIMEOUT_MS: 200
      KAFKA_MOCK_URL: http://kafka-mock:9300/events
      KAFKA_MOCK_TIMEOUT_MS: 250
    depends_on:
      edge-admin:
        condition: service_healthy
      kafka-mock:
        condition: service_healthy
      metadata:
        condition: service_healthy
      origin:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./edge/logs:/var/log/nginx
      - edge-cache:/var/cache/nginx
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - playground

  edge-admin:
    build:
      context: ./edge-admin
    container_name: k6-playground-edge-admin
    environment:
      CACHE_ROOT: /var/cache/nginx
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - edge-cache:/var/cache/nginx
    networks:
      - playground

  metadata:
    build:
      context: ./metadata-service
    container_name: k6-playground-metadata
    expose:
      - "9100"
    ports:
      - "9100:9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - playground

  redis:
    image: redis:7.4-alpine
    container_name: k6-playground-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - playground

  kafka-mock:
    build:
      context: ./kafka-mock
    container_name: k6-playground-kafka-mock
    expose:
      - "9300"
    ports:
      - "9300:9300"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9300/healthz', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - playground

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: k6-playground-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:9090/-/healthy || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - playground

volumes:
  edge-cache:
  prometheus-data:

networks:
  playground:
    name: k6-playground-network
