worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_CONNECT_TIMEOUT_MS;
env REDIS_SEND_TIMEOUT_MS;
env REDIS_READ_TIMEOUT_MS;
env REDIS_KEEPALIVE_TIMEOUT_MS;
env REDIS_KEEPALIVE_POOL;
env METADATA_BASE_URL;
env METADATA_TIMEOUT_MS;
env KAFKA_MOCK_URL;
env KAFKA_MOCK_TIMEOUT_MS;

events {
  worker_connections 1024;
}

http {
  lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/nginx/lua/?/init.lua;;";
  lua_shared_dict prometheus_metrics 32m;
  lua_shared_dict edge_runtime_cache 8m;
  resolver 127.0.0.11 ipv6=off valid=30s;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=vod_cache:10m max_size=256m inactive=30m use_temp_path=off;

  log_format edge_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"uri":"$uri",'
      '"args":"$args",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_cache_status":"$upstream_cache_status",'
      '"cache_key":"$scheme$proxy_host$uri$is_args$args",'
      '"traffic_class":"$sent_http_x_traffic_class",'
      '"media_class":"$sent_http_x_media_class",'
      '"route_family":"$sent_http_x_openresty_route_family",'
      '"target_kind":"$sent_http_x_openresty_target_kind",'
      '"lua_access_ms":"$sent_http_x_openresty_lua_access_ms",'
      '"lua_content_ms":"$sent_http_x_openresty_lua_content_ms",'
      '"header_filter_ms":"$sent_http_x_openresty_header_filter_ms",'
      '"metadata_outcome":"$sent_http_x_openresty_metadata_outcome",'
      '"metadata_fetch_ms":"$sent_http_x_openresty_metadata_fetch_ms",'
      '"redis_access_outcome":"$sent_http_x_openresty_redis_access_outcome",'
      '"redis_access_error":"$sent_http_x_openresty_redis_access_error",'
      '"redis_access_connect_ms":"$sent_http_x_openresty_redis_access_connect_ms",'
      '"redis_access_command_ms":"$sent_http_x_openresty_redis_access_command_ms",'
      '"redis_content_outcome":"$sent_http_x_openresty_redis_content_outcome",'
      '"redis_content_error":"$sent_http_x_openresty_redis_content_error",'
      '"redis_content_connect_ms":"$sent_http_x_openresty_redis_content_connect_ms",'
      '"redis_content_command_ms":"$sent_http_x_openresty_redis_content_command_ms",'
      '"lua_gc_delta_kb":"$sent_http_x_openresty_lua_gc_delta_kb"'
    '}';

  init_worker_by_lua_block {
    local metrics = require("myedge.metrics")
    metrics.init()
  }

  upstream origin_upstream {
    server origin:8000;
  }

  upstream edge_admin_upstream {
    server edge-admin:9000;
  }

  server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/edge-access.log edge_json;

    access_by_lua_block {
      require("myedge.phase_trace").begin()
    }

    header_filter_by_lua_block {
      require("myedge.phase_trace").apply_response_headers()
    }

    log_by_lua_block {
      require("myedge.phase_trace").finish()
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /metrics {
      access_log off;
      content_by_lua_block {
        require("myedge.metrics").collect()
      }
    }

    location = /cache {
      if ($request_method != PURGE) {
        return 405;
      }
      proxy_http_version 1.1;
      proxy_pass http://edge_admin_upstream/purge;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Edge-Admin "cache-purge";
      access_log off;
    }

    location = /openresty/lua/transform {
      content_by_lua_block {
        require("myedge.lua_handlers").handle_transform()
      }
    }

    location = /openresty/lua/policy {
      content_by_lua_block {
        require("myedge.lua_handlers").handle_policy()
      }
    }

    location ^~ /live/ {
      proxy_http_version 1.1;
      proxy_pass http://origin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Edge-Class live;
      proxy_buffering off;
      add_header Cache-Control "public, max-age=2" always;
      add_header X-Traffic-Class "live" always;
      add_header X-Edge-Pop "codespace-lab" always;
    }

    location ^~ /vod/ {
      proxy_http_version 1.1;
      proxy_pass http://origin_upstream;
      proxy_cache vod_cache;
      proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      proxy_cache_lock_age 1s;
      proxy_cache_valid 200 301 302 10m;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Edge-Class vod;
      proxy_buffering on;
      add_header Cache-Control "public, max-age=300" always;
      add_header X-Traffic-Class "vod" always;
      add_header X-Edge-Pop "codespace-lab" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Cache-Key "$scheme$proxy_host$uri$is_args$args" always;
    }

    location / {
      proxy_http_version 1.1;
      proxy_pass http://origin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Traffic-Class "api" always;
      add_header X-Edge-Pop "codespace-lab" always;
    }
  }
}
